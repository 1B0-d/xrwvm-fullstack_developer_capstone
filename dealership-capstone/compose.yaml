# Local demonstration only. MongoDB is not exposed on a host port.
services:
  mongo:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mongo_data:/data/db
  api:
    build: ./server/database
    environment:
      MONGODB_URI: mongodb://mongo:27017/dealership_demo
      PORT: 3030
      HOST: 0.0.0.0
    depends_on:
      mongo:
        condition: service_healthy
  sentiment:
    build: ./server/djangoapp/microservices
  web:
    build: ./server
    environment:
      DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY before starting Compose}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      backend_url: http://api:3030
      sentiment_analyzer_url: http://sentiment:5000
    ports:
      - "127.0.0.1:${DEALERSHIP_PORT:-18000}:8000"
    depends_on:
      - api
      - sentiment
    volumes:
      - django_data:/data
volumes:
  mongo_data:
  django_data:
