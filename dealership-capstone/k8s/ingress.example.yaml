# Optional: requires an ingress controller and DNS/TLS setup in the target cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: best-cars
  namespace: best-cars
spec:
  rules:
    - host: best-cars.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: django
                port:
                  number: 80
