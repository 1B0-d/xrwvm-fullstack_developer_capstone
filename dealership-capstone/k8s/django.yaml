apiVersion: v1
kind: ConfigMap
metadata:
  name: django-config
  namespace: best-cars
data:
  DJANGO_ALLOWED_HOSTS: "best-cars.example.com,localhost,127.0.0.1"
  DJANGO_DB_PATH: "/data/db.sqlite3"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: django-data
  namespace: best-cars
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: best-cars
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: django
          image: us.icr.io/replace-with-namespace/best-cars-django:replace-with-tag
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: django-config
          env:
            - name: DEBUG
              value: "False"
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: secret-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: django-data
              mountPath: /data
      volumes:
        - name: django-data
          persistentVolumeClaim:
            claimName: django-data
---
apiVersion: v1
kind: Service
metadata:
  name: django
  namespace: best-cars
spec:
  selector:
    app: django
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
